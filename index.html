<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Blog</title>

    <!-- 通用样式（跨平台）：令牌、背景、加载状态 -->
    <link rel="stylesheet" href="assets/css/tokens.css">

    <!-- 防 FOUC：平台组件自建 DOM 前先隐藏（组件根元素 class 为跨平台约定） -->
    <style>
        .search-window,
        .sidebar {
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- 底层：背景与加载动画（跨平台公共骨架） -->
    <canvas id="background"></canvas>
    <div id="loadStatus" class="load-status"></div>

    <!-- 其余 DOM（侧栏/搜索框/标签栏/文章窗口）由平台模块自建 -->
    <script type="module" src="assets/javascript/main.js"></script>
</body>

</html>
