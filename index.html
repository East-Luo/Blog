<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Blog</title>

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/search.css">
    <link rel="stylesheet" href="assets/css/tabbar.css">
    <link rel="stylesheet" href="assets/css/article.css">

    <!-- 防 FOUC：外部样式加载前先隐藏动态组件，避免搜索框以无样式状态闪现 -->
    <style>
        .search-window,
        .sidebar {
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- 底层：背景与加载动画 -->
    <canvas id="background"></canvas>
    <div id="loadStatus" class="load-status"></div>

    <!-- 中层：文章窗口（window-manager 动态挂载） -->
    <div id="windows"></div>

    <!-- 最底层：搜索框（固定位置，低于所有文章层） -->
    <div id="searchWindow" class="search-window">
        <div class="search-container">
            <div id="searchButton" class="search-button">
                <div class="triangle"></div>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索...">
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <!-- 左侧：文章列表 -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-collapsed-hint">
            <span>☰</span>
        </div>
        <div class="sidebar-content">
            <h3>文章列表</h3>
            <div id="articleList" class="article-list"></div>
        </div>
    </div>

    <!-- 右侧：标签栏 -->
    <div id="tabbar" class="tabbar"></div>

    <script type="module" src="assets/javascript/main.js"></script>
</body>

</html>
